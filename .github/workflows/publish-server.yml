name: Publish score-server image

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/publish-server.yml']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          tags: ghcr.io/teejs/kitten-cannon-api:latest
          # Unraid's update check can't read bare OCI manifests or attestation
          # entries — keep Docker media types, no provenance/SBOM.
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
